# Rotina de preços — escreve no site os preços do Supabase (somente leitura)
# Detalhes e marcadores: scripts/atualizar-precos.mjs
#
# Quando roda:
#   - todo dia às 6h de Brasília (09:00 UTC)
#   - a cada publicação (push) na main
#   - manualmente: aba Actions → "Preços do Supabase → site" → Run workflow
# Só publica se algum preço mudou. Se o Supabase falhar, a execução fica
# vermelha, nada é publicado e o GitHub manda e-mail de falha.
#
# GitHub desliga rotina agendada depois de 60 dias sem atividade no repositório.
# Para não parar: todo dia a rotina reativa a si mesma pela API e, se o repositório
# ficar 50 dias sem nenhum commit, ela grava dados/rotina-ativa.txt (um commit
# pequeno, só com a data) para manter o repositório ativo.

name: Preços do Supabase → site

on:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_falha:
        description: 'Teste: simular Supabase fora do ar (não publica nada)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: precos-site
  cancel-in-progress: false

jobs:
  precos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Manter a rotina ativa (reativa a agenda pela API)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/precos.yml/enable" || echo "Aviso - nao consegui reativar pela API"

      - name: Ler o Supabase e escrever os preços
        id: precos
        env:
          SUPABASE_URL: ${{ inputs.simular_falha && 'https://supabase-indisponivel.invalid' || '' }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then unset SUPABASE_URL; fi
          node scripts/atualizar-precos.mjs

      - name: Publicar (só se algum preço mudou)
        if: steps.precos.outputs.mudou == 'sim'
        run: |
          git config user.name "rotina-de-precos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public api dados
          git commit -m "Preços atualizados a partir do Supabase (rotina automática)" \
                     -m "Arquivos alterados: ${{ steps.precos.outputs.arquivos }}. Fonte: precos_bairros/precos_zonas (somente leitura)."
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "Não consegui publicar depois de 3 tentativas"; exit 1

      - name: Manter o repositório ativo (commit só após 50 dias sem commits)
        if: always() && github.event_name == 'schedule'
        run: |
          git pull --quiet origin main || true
          ultimo=$(git log -1 --format=%ct)
          agora=$(date +%s)
          dias=$(( (agora - ultimo) / 86400 ))
          echo "Dias desde o último commit: $dias"
          if [ "$dias" -ge 50 ]; then
            mkdir -p dados
            echo "Rotina de preços ativa — verificado em $(TZ=America/Sao_Paulo date +%d/%m/%Y)" > dados/rotina-ativa.txt
            git config user.name "rotina-de-precos[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/rotina-ativa.txt
            git commit -m "Rotina de preços: mantém o repositório ativo (50 dias sem commits)"
            git push origin HEAD:main
          fi

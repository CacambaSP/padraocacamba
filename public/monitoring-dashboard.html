<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Monitoring — Padrão Caçamba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0A0A0A;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* LOGIN SCREEN */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0A0A0A 0%, #111 100%);
    }

    .login-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }

    .login-title {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 400;
      text-align: center;
    }

    .login-sub {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      background: #0A0A0A;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
    }

    .form-input:focus {
      outline: none;
      border-color: #1E3A8A;
      background: #161616;
    }

    .form-button {
      width: 100%;
      padding: 12px;
      background: #00FF7F;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .form-button:hover {
      background: #00FF7F;
      box-shadow: 0 0 16px rgba(0, 255, 127, 0.4);
    }

    .form-button:active {
      opacity: 0.9;
    }

    .login-error {
      display: none;
      background: #1c0a0a;
      border: 1px solid #3a1010;
      color: #f87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    .login-error.show {
      display: block;
    }

    /* DASHBOARD SCREEN */
    .dashboard-screen {
      display: none;
    }

    .dashboard-screen.show {
      display: block;
    }

    header {
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 36px;
      font-weight: 400;
    }

    .logout-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .logout-btn:hover {
      background: #444;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #00FF7F;
    }

    .rankings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .ranking-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .ranking-card:hover {
      border-color: #333;
      background: #151515;
    }

    .ranking-card.subindo {
      border-left: 4px solid #4ade80;
    }

    .ranking-card.caindo {
      border-left: 4px solid #f87171;
    }

    .ranking-card.estavel {
      border-left: 4px solid #94a3b8;
    }

    .ranking-card.novo {
      border-left: 4px solid #60a5fa;
    }

    .bairro-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zona-badge {
      font-size: 10px;
      background: #1a3a1a;
      color: #4ade80;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .posicao-container {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }

    .posicao-atual {
      font-size: 40px;
      font-weight: 700;
      color: #00FF7F;
    }

    .posicao-anterior {
      font-size: 14px;
      color: #666;
    }

    .trend-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .trend-icon {
      font-size: 18px;
    }

    .trend-text.up {
      color: #4ade80;
    }

    .trend-text.down {
      color: #f87171;
    }

    .trend-text.stable {
      color: #94a3b8;
    }

    .trend-text.novo {
      color: #60a5fa;
    }

    .ultima-atualizacao {
      font-size: 11px;
      color: #444;
      border-top: 1px solid #222;
      padding-top: 12px;
      margin-top: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #1c0a0a;
      border: 1px solid #3a1010;
      border-radius: 8px;
      padding: 16px;
      color: #f87171;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }

      .rankings-grid {
        grid-template-columns: 1fr;
      }

      .stats-bar {
        grid-template-columns: 1fr 1fr;
      }

      .login-box {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h2 class="login-title">🔐 Monitoring</h2>
    <p class="login-sub">Acesso restrito — Padrão Caçamba</p>
    
    <div class="login-error" id="login-error"></div>
    
    <form onsubmit="fazerLogin(event)">
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input 
          type="password" 
          id="password-input" 
          class="form-input" 
          placeholder="Digite a senha"
          autocomplete="off"
        >
      </div>
      <button type="submit" class="form-button">Acessar</button>
    </form>
  </div>
</div>

<!-- DASHBOARD SCREEN -->
<div class="dashboard-screen" id="dashboard-screen">
  <div class="container">
    <header>
      <div>
        <h1>📊 Monitoring de Rankings</h1>
        <p class="subtitle">Padrão Caçamba — acompanhamento automático de posições no Google</p>
      </div>
      <button class="logout-btn" onclick="fazerLogout()">Sair</button>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Bairros Monitorados</div>
        <div class="stat-value" id="total-bairros">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Subindo</div>
        <div class="stat-value" id="total-subindo" style="color: #4ade80;">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Caindo</div>
        <div class="stat-value" id="total-caindo" style="color: #f87171;">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Última Verificação</div>
        <div class="stat-value" id="ultima-verificacao" style="font-size: 14px; color: #94a3b8;">—</div>
      </div>
    </div>

    <div id="error-container"></div>

    <div class="rankings-grid" id="rankings">
      <div class="loading">⏳ Carregando dados...</div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://ejfuqijtiberxsnvxdwm.supabase.co';
const SB_KEY = 'sb_publishable_VvMIbjms3nf-YLh46wuPKA_6FaRpaxX';

// SENHA HASH (bcrypt format, simula segurança)
// Senha padrão: "monitoring2026" (você muda depois)
const SENHA_HASH = 'monitoring2026';

// ========================================
// AUTENTICAÇÃO
// ========================================

function fazerLogin(event) {
  event.preventDefault();
  
  const senha = document.getElementById('password-input').value;
  const errorEl = document.getElementById('login-error');
  
  // Verificar senha (em produção usar bcrypt real)
  if (senha !== SENHA_HASH) {
    errorEl.textContent = '❌ Senha incorreta';
    errorEl.classList.add('show');
    document.getElementById('password-input').value = '';
    return;
  }
  
  // Salvar token no localStorage (válido por 24h)
  const token = btoa(`monitoring:${Date.now()}`);
  localStorage.setItem('monitoring_token', token);
  localStorage.setItem('monitoring_token_time', Date.now().toString());
  
  // Registrar acesso (log)
  registrarAcesso('dashboard', 'success');
  
  // Mostrar dashboard
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard-screen').classList.add('show');
  
  carregarRankings();
}

function fazerLogout() {
  localStorage.removeItem('monitoring_token');
  localStorage.removeItem('monitoring_token_time');
  location.reload();
}

function verificarAutenticacao() {
  const token = localStorage.getItem('monitoring_token');
  const tokenTime = localStorage.getItem('monitoring_token_time');
  
  if (!token || !tokenTime) {
    return false;
  }
  
  // Token válido por 24 horas
  const agora = Date.now();
  const diff = agora - parseInt(tokenTime);
  const 24h = 24 * 60 * 60 * 1000;
  
  if (diff > 24h) {
    localStorage.removeItem('monitoring_token');
    localStorage.removeItem('monitoring_token_time');
    return false;
  }
  
  return true;
}

// ========================================
// DADOS
// ========================================

async function carregarRankings() {
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/rankings_monitoring?order=bairro.asc`,
      {
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${SB_KEY}`,
          'Content-Type': 'application/json'
        }
      }
    );

    if (!res.ok) {
      throw new Error(`Erro HTTP: ${res.status}`);
    }

    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      document.getElementById('rankings').innerHTML = 
        '<div class="loading">Nenhum dado encontrado. Execute o SQL no Supabase primeiro.</div>';
      return;
    }

    // Estatísticas
    const totalBairros = data.length;
    const subindo = data.filter(r => r.trend === 'subindo').length;
    const caindo = data.filter(r => r.trend === 'caindo').length;
    const ultimaVerificacao = data.length > 0 
      ? new Date(data[0].data_verificacao).toLocaleDateString('pt-BR')
      : '—';

    document.getElementById('total-bairros').textContent = totalBairros;
    document.getElementById('total-subindo').textContent = subindo;
    document.getElementById('total-caindo').textContent = caindo;
    document.getElementById('ultima-verificacao').textContent = ultimaVerificacao;

    // Renderizar cards
    const html = data.map(r => {
      const trendIcon = r.trend === 'subindo' ? '📈' :
                        r.trend === 'caindo' ? '📉' :
                        r.trend === 'novo' ? '🆕' : '→';
      
      const trendText = r.trend === 'subindo' ? 'Subindo' :
                        r.trend === 'caindo' ? 'Caindo' :
                        r.trend === 'novo' ? 'Novo' : 'Estável';

      const dataFormatada = r.data_verificacao 
        ? new Date(r.data_verificacao).toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit'
          })
        : '—';

      return `
        <div class="ranking-card ${r.trend}">
          <div class="bairro-name">
            <span>${r.bairro}</span>
            <span class="zona-badge">${r.zona}</span>
          </div>
          
          <div class="posicao-container">
            <div class="posicao-atual">${r.posicao_google || '—'}</div>
            <div class="posicao-anterior">
              ${r.posicao_anterior > 0 ? `(era #${r.posicao_anterior})` : ''}
            </div>
          </div>

          <div class="trend-info">
            <span class="trend-icon">${trendIcon}</span>
            <span class="trend-text ${r.trend === 'subindo' ? 'up' : r.trend === 'caindo' ? 'down' : r.trend === 'novo' ? 'novo' : 'stable'}">
              ${trendText}
            </span>
          </div>

          <div class="ultima-atualizacao">
            Última verificação: ${dataFormatada}
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('rankings').innerHTML = html;

  } catch (error) {
    console.error('Erro:', error);
    document.getElementById('error-container').innerHTML = `
      <div class="error">
        ⚠️ Erro ao carregar dados: ${error.message}
      </div>
    `;
  }
}

async function registrarAcesso(endpoint, status) {
  // Registrar no Supabase (opcional, para auditoria)
  try {
    await fetch(`${SB_URL}/rest/v1/access_logs`, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({
        endpoint: endpoint,
        status: status,
        user_agent: navigator.userAgent
      })
    });
  } catch (err) {
    console.error('Erro ao registrar acesso:', err);
  }
}

// ========================================
// INICIALIZAÇÃO
// ========================================

window.addEventListener('load', () => {
  if (verificarAutenticacao()) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard-screen').classList.add('show');
    carregarRankings();
  }
  
  // Atualizar a cada 30 segundos (se autenticado)
  setInterval(() => {
    if (verificarAutenticacao()) {
      carregarRankings();
    }
  }, 30000);
});

// Focus no input ao carregar
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('password-input').focus();
});
</script>

</body>
</html>
